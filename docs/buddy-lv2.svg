<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260" role="img" aria-label="octocat&apos;s AI buddy: level 2 Ember, 4M tokens" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <radialGradient id="glowg">
      <stop offset="0" stop-color="#8250df" stop-opacity="0.14"/><stop offset="1" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0969da" flood-opacity="0.22"/>
    </filter>
    <filter id="cellglow" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.6" flood-color="#8250df" flood-opacity="0.9"/>
    </filter>
    <clipPath id="clip"><rect x="0.5" y="0.5" width="239" height="259" rx="8"/></clipPath>
  </defs>
  <style>
    .fade { opacity: 0; animation: fadeUp 0.5s ease-out forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .beam { animation: beam 7s linear infinite; }
    @keyframes beam { to { stroke-dashoffset: -100; } }
    @media (prefers-reduced-motion: reduce) { .fade { opacity: 1; animation: none; } .beam { animation: none; opacity: 0.3; } }
  </style>
  <rect x="0.5" y="0.5" width="239" height="259" rx="8" fill="#ffffff" stroke="#e4e2e2"/>
  <g clip-path="url(#clip)">
    <circle cx="204" cy="4" r="96" fill="url(#glowg)"/>
    <circle cx="10" cy="260" r="70" fill="url(#glowg)"/>
  </g>
  <rect class="beam" x="0.5" y="0.5" width="239" height="259" rx="8" fill="none" stroke="url(#ag)" stroke-width="1" pathLength="100" stroke-dasharray="26 74" stroke-linecap="round" opacity="0.75"/>
  <text class="fade" x="120" y="32" text-anchor="middle" font-size="13" font-weight="600" fill="#0969da">octocat · AI buddy</text>
  <circle class="fade" style="animation-delay:100ms" cx="120" cy="124" r="62" fill="url(#glowg)"/>
  <g transform="translate(120, 112)"><g class="fade" style="animation-delay:150ms">
      <g transform="translate(0, 11.199999999999996)"><path transform="translate(-30.800000000000004, -30.800000000000004) scale(4.4)" d="M7 0 L8.6 5.4 L14 7 L8.6 8.6 L7 14 L5.4 8.6 L0 7 L5.4 5.4 Z" fill="#0969da" fill-opacity="0.95"/></g>
      <g transform="translate(0, 11.199999999999996)"><circle cx="-7.5" cy="2" r="3.2" fill="#ffffff"/><circle cx="7.5" cy="2" r="3.2" fill="#ffffff"/></g>
      <path d="M-6 22.199999999999996 Q0 26.199999999999996 6 22.199999999999996" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="0" cy="48" rx="22" ry="4" fill="#0969da" fill-opacity="0.12"/></g></g>
  <text class="fade" style="animation-delay:300ms" x="120" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="url(#ag)">Lv.2 · Ember</text>
  <text class="fade" style="animation-delay:350ms" x="120" y="201" text-anchor="middle" font-size="10" fill="#6e7781">4M tokens</text>
  <g class="fade" style="animation-delay:400ms">
    <rect x="44" y="209" width="152" height="5" rx="2.5" fill="#0969da" fill-opacity="0.12"/>
    <rect x="44" y="209" width="51" height="5" rx="2.5" fill="#0969da" fill-opacity="0.6"/>
    <text x="120" y="226" text-anchor="middle" font-size="8" fill="#6e7781">6M to Lv.3</text>
  </g>
  <a href="https://github.com/JinVibe/ai-usage-cards" target="_blank">
    <text x="216" y="246" text-anchor="end" font-size="9" fill="#6e7781" fill-opacity="0.8">made with ai-usage-cards</text>
