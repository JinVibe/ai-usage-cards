<svg xmlns="http://www.w3.org/2000/svg" width="450" height="260" viewBox="0 0 450 260" role="img" aria-label="octocat: at least 42 AI-assisted commits, at least 17 merged PRs, 3 releases" font-family="'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif">
  <defs>
