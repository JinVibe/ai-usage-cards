      <path d="M-8 5 Q0 11 8 5" fill="none" stroke="#0969da" stroke-width="2" stroke-linecap="round"/>
      <rect x="-19" y="16" width="38" height="28" rx="10" fill="#0969da" fill-opacity="0.16" stroke="#0969da" stroke-width="1.5"/>
      <g transform="translate(0, 30)"><path transform="translate(-5.6000000000000005, -5.6000000000000005) scale(0.8)" d="M7 0 L8.6 5.4 L14 7 L8.6 8.6 L7 14 L5.4 8.6 L0 7 L5.4 5.4 Z" fill="#0969da" fill-opacity="1"/></g>
